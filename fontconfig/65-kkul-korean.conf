<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- 꿀툴 문서 변환: 한글 문서에 자주 쓰이는 상용 글꼴 이름을 무료 글꼴로 대체해요.
     명조(바탕) 계열 → 나눔명조 / Noto Serif CJK KR, 고딕(돋움) 계열 → 나눔고딕 / Noto Sans CJK KR -->
<fontconfig>
  <!-- 명조·바탕 계열 -->
  <alias binding="same"><family>함초롬바탕</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>HCR Batang</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>한컴바탕</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>HYSMyeongJo-Medium</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>바탕</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>바탕체</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>Batang</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>BatangChe</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>궁서</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>Gungsuh</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>신명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>휴먼명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>HY신명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>한양신명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>새바탕</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <!-- 고딕·돋움 계열 -->
  <alias binding="same"><family>함초롬돋움</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>HCR Dotum</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>한컴돋움</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>맑은 고딕</family><prefer><family>NanumBarunGothic</family><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>Malgun Gothic</family><prefer><family>NanumBarunGothic</family><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>굴림</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>굴림체</family><prefer><family>NanumGothicCoding</family><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>Gulim</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>GulimChe</family><prefer><family>NanumGothicCoding</family><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>돋움</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>돋움체</family><prefer><family>NanumGothicCoding</family><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>Dotum</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>DotumChe</family><prefer><family>NanumGothicCoding</family><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>휴먼고딕</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>HY헤드라인M</family><prefer><family>NanumSquare</family><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>HYHeadLine-Medium</family><prefer><family>NanumSquare</family><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>HY견고딕</family><prefer><family>NanumSquare</family><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>HY중고딕</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>HY그래픽</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>새굴림</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>새돋움</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>Apple SD Gothic Neo</family><prefer><family>NanumBarunGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>나눔고딕</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>나눔명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>나눔바른고딕</family><prefer><family>NanumBarunGothic</family></prefer></alias>
  <alias binding="same"><family>나눔스퀘어</family><prefer><family>NanumSquare</family></prefer></alias>
  <!-- 이름 없는 한글: 한국어 글꼴을 먼저 -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK KR</string><string>NanumGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend"><string>Noto Serif CJK KR</string><string>NanumMyeongjo</string></edit>
  </match>
</fontconfig>
